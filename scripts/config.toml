# Termia Configuration
# Location: ~/.termia/config.toml

[general]
# Storage
storage_path = "~/.termia"
max_transcript_age_days = 90    # Auto-delete old transcripts
max_db_size_mb = 1000           # Rotate DB when exceeds

# Recording
record_outputs = true           # Capture stdout/stderr
record_env_vars = false         # Store environment (privacy risk)
ignore_patterns = [
    "^pass ",                   # Password manager
    "^export .*SECRET",         # Secrets
]

[llm]
# Default provider
default_provider = "openai"     # "openai" | "anthropic" | "ollama" | "deepseek" | "openai_compatible"

# OpenAI
[llm.openai]
api_key = ""                    # Saved directly in config.toml
model = "gpt-4o"
thinking_level = ""             # Optional: low | medium | high when supported
max_tokens = 2000
base_url = ""                   # Optional: override default endpoint

# Anthropic
[llm.anthropic]
api_key = ""
model = "claude-3-7-sonnet-20250219"
thinking_level = ""             # Optional: low | medium | high when supported
max_tokens = 2000

# Ollama (local)
[llm.ollama]
api_key = ""                    # Ollama doesn't require API key
model = "llama3.2:latest"
thinking_level = ""
base_url = "http://localhost:11434"

# DeepSeek
[llm.deepseek]
api_key = ""
model = "deepseek-chat"
thinking_level = ""
base_url = "https://api.deepseek.com"

# OpenAI-compatible custom provider
[llm.openai_compatible]
api_key = ""
model = ""
thinking_level = ""             # Optional: low | medium | high for compatible reasoning models
max_tokens = 2000
base_url = ""

[tui]
# Theme
theme = "default"               # "default" | "nord" | "dracula"
show_exit_codes = true
highlight_errors = true         # Red background for exit != 0

# Keybindings (vim-style by default)
navigation = "vim"              # "vim" | "emacs" | "arrows"

[sync]
# Cloud sync (P1)
enabled = false
endpoint = "https://api.termia.io"
auto_sync_interval_min = 15
encrypt_local = true            # E2E encryption

[agent_team]
# Enabled agent roles (allowlist)
roles = ["coordinator", "researcher"]
# Require approval before executing tools (bash/file)
require_approval = true

# Named teams (optional)
[[agent_team.teams]]
name = "default"
roles = ["coordinator", "researcher"]

# MCP servers (placeholder)
[[agent_team.mcp_servers]]
name = ""
endpoint = ""
tools = []
